<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Ninja</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Account Ninja 🥷</h1>

        <div class="input-section">
            <h2>Add New Account</h2>
            <input type="text" id="accountName" placeholder="Account Name">
            <input type="number" id="goalAmount" placeholder="Goal Amount ($)">
            <input type="number" id="priority" placeholder="Priority (1 is highest)">
            <input type="number" id="zenWeight" step="0.1" min="1" max="3" placeholder="3Zen">
            <input type="number" id="daysRemaining" placeholder="Days Remaining">
            <button id="addItemBtn">Add Account</button>
        </div>

        <div class="distribution-section">
            <h2>Distribute Funds</h2>
            <input type="number" id="amountToDistribute" placeholder="Amount to Distribute ($)">
            <button id="distributeBtn">Distribute</button>
            <p id="distributionMessage"></p>
            <button id="downloadCsvBtn" class="secondary-btn">Download as CSV</button>
        </div>

        <h2>Accounts List</h2>
        <table id="accountsTable">
            <thead>
                <tr>
                    <th>Account Name</th>
                    <th>Goal ($)</th>
                    <th>Current ($)</th>
                    <th>Remaining ($)</th>
                    <th>Priority</th>
                    <th>3Zen (1-3)</th>
                    <th>Days Left</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="accountsTableBody">
                </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
