<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Ninja</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Account Ninja 🥷</h1>

        <div class="input-section">
            <h2>Add New Account</h2>
            <input type="text" id="accountName" placeholder="Account Name">
            <input type="number" id="goalAmount" placeholder="Goal Amount ($)">
            <input type="number" id="priority" placeholder="Priority (auto-set by order)">
            <input type="number" id="zenWeight" step="0.1" min="1" max="3" placeholder="Zen Weight (1-3)">
            <input type="number" id="daysRemaining" placeholder="Days Remaining">
            <button id="addItemBtn">Add Account</button>
        </div>

        <div class="import-export-section">
            <h2>Manage Data & Simulations</h2>
            <div class="data-controls-container">
                <div class="import-controls">
                    <label for="csvFileInput">Import Accounts from CSV (will overwrite existing):</label>
                    <input type="file" id="csvFileInput" accept=".csv">
                    <button id="importCsvBtn" class="secondary-btn">Import CSV</button>
                    <p id="importMessage"></p>
                </div>
                <div class="export-controls">
                     <button id="downloadCsvBtn" class="secondary-btn">Download Current State CSV</button>
                     <button id="downloadTimelineBtn" class="secondary-btn">Download Timeline Simulation</button>
                </div>
            </div>
        </div>

        <div class="distribution-section">
            <h2>Live Distribution & Simulation Controls</h2>
            <input type="number" id="amountToDistribute" placeholder="Amount per Cycle ($)">
            <label for="distributionCyclesInput" style="margin-left: 10px;">Cycles:</label>
            <input type="number" id="distributionCyclesInput" value="1" min="1" style="width: 70px;">
            <button id="distributeBtn" style="margin-left: 10px;">Distribute</button>
            <p id="distributionMessage"></p>
        </div>

        <h2>Accounts List (Drag rows to re-order/re-prioritize)</h2>
        <table id="accountsTable">
            <thead>
                <tr>
                    <th>Account Name</th>
                    <th>Goal ($)</th>
                    <th>Current ($)</th>
                    <th>Remaining ($)</th>
                    <th>Priority</th>
                    <th>Zen (1-3)</th>
                    <th>Days Left</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="accountsTableBody">
                </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
